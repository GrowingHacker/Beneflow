<div>
  <!-- 上半：按进货单挑商品退货 -->
  <div class="page-card">
    <div class="toolbar">
      <span>供应商：</span>
      <el-select v-model="supplierId" placeholder="选择供应商" filterable style="width:200px;" @change="loadOrders">
        <el-option v-for="s in suppliers" :key="s.id" :label="s.name" :value="s.id" />
      </el-select>
      <span style="margin-left:10px;">进货单：</span>
      <el-select v-model="orderId" placeholder="选择进货单" style="width:200px;" @change="loadDetail">
        <el-option v-for="o in orders" :key="o.id" :label="o.orderNo" :value="o.id" />
      </el-select>
    </div>
    <div v-if="!orderId" class="empty-tip">请选择供应商与进货单</div>
    <div v-else>
      <div class="table-wrap">
        <el-table :data="items" border size="small">
          <el-table-column label="商品" prop="name" min-width="160" />
          <el-table-column label="进价" width="100"><template #default="{ row }">{{ common.money(row.costPrice) }}</template></el-table-column>
          <el-table-column label="进货数量" prop="qty" width="100" />
          <el-table-column label="退货数量" width="160"><template #default="{ row }"><el-input-number v-model="row.returnQty" :min="0" :max="row.qty" size="small" controls-position="right" /></template></el-table-column>
          <el-table-column label="退货金额" width="120"><template #default="{ row }">{{ common.money((row.returnQty||0)*row.costPrice) }}</template></el-table-column>
        </el-table>
      </div>
      <div style="margin-top:14px;text-align:right;">
        退货合计 <b class="cart-total">{{ common.money(returnTotal) }}</b>
        <el-button type="primary" :loading="submitting" style="margin-left:14px;" @click="submit">提交退货</el-button>
      </div>
    </div>
  </div>

  <!-- 下半：退货记录（作废入口在这里 —— 退货单是「已退款给供应商」的凭证，
       退款本身没法自动抹掉，所以只把库存补回来、把单据标掉，不再参与供应商对账） -->
  <div class="page-card">
    <div class="toolbar">
      <el-input v-model="keyword" placeholder="退货单号 / 供应商" clearable style="width:220px;" @keyup.enter="search" />
      <el-button type="primary" @click="search">查询</el-button>
    </div>
    <div class="table-wrap">
      <el-table :data="records" v-loading="loading" border size="small"
                :show-summary="records.length > 0" :summary-method="recordSummary">
        <el-table-column label="单号" prop="orderNo" width="160" />
        <el-table-column label="供应商" prop="supplierName" width="150" />
        <el-table-column label="状态" width="90" align="center">
          <template #default="{ row }">
            <el-tag v-if="row.isVoided" type="info" size="small">已作废</el-tag>
            <el-tag v-else type="success" size="small">已退货</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="应退金额" width="110"><template #default="{ row }">{{ common.money(row.refundAmount) }}</template></el-table-column>
        <el-table-column label="退货原因" prop="reason" min-width="140" show-overflow-tooltip />
        <el-table-column label="操作人" prop="createdByName" width="100" />
        <el-table-column label="日期" prop="createdAt" width="160" />
        <el-table-column label="操作" width="80" fixed="right" align="center">
          <template #default="{ row }">
            <div class="op-btns">
              <el-button v-if="!row.isVoided" text type="danger" title="作废" @click="doVoid(row)"><el-icon><Delete /></el-icon></el-button>
              <span v-else class="muted">—</span>
            </div>
          </template>
        </el-table-column>
      </el-table>
    </div>
    <div class="pagination-wrap">
      <el-pagination
        v-model:current-page="page" v-model:page-size="pageSize" :total="total"
        :page-sizes="[10,20,50]" layout="total, sizes, prev, pager, next" @size-change="load" @current-change="load" />
    </div>
  </div>
</div>

<script page-setup>
function pageSetup(deps) {
  const { ref, computed, onMounted } = Vue;
  const { api, common, toast, confirm } = deps;
  const suppliers = ref([]); const orders = ref([]);
  const supplierId = ref(null); const orderId = ref(null);
  const items = ref([]); const submitting = ref(false);
  const returnTotal = computed(() => items.value.reduce((s,i)=>s+Number(i.returnQty||0)*Number(i.costPrice||0),0));

  // ---- 退货记录 ----
  const records = ref([]); const loading = ref(false);
  const keyword = ref(''); const page = ref(1); const pageSize = ref(20); const total = ref(0);
  // 合计走后端「同查询条件的全量合计（剔除已作废）」，不是当前页合计
  const summaryInfo = ref(null);

  // el-table 合计行：只映射金额列，其余留空；标签固定说明口径
  function recordSummary({ columns }) {
    const s = summaryInfo.value || {};
    return columns.map((col, i) => {
      if (i === 0) return `合计 ${s.returns || 0} 笔（不含已作废）`;
      return col.label === '应退金额' ? common.money(s.refundAmount || 0) : '';
    });
  }

  async function loadSuppliers() { try { const r = await api.get('/suppliers', { params: { pageSize: 200 } }); suppliers.value = r.list||[]; } catch(e){} }
  async function loadOrders() {
    orderId.value = null; items.value = [];
    try { const r = await api.get('/purchases', { params: { pageSize: 200 } }); orders.value = (r.list||[]).filter(o => o.supplierId === supplierId.value); } catch(e){}
  }
  async function loadDetail() {
    items.value = [];
    if (!orderId.value) return;
    try {
      const res = await api.get('/purchases/' + orderId.value);
      items.value = (res.items || []).map(i => Object.assign({}, i, { returnQty: 0 }));
    } catch(e){ orderId.value = null; }
  }
  async function submit() {
    const sel = items.value.filter(i => i.returnQty > 0);
    if (!sel.length) { toast('请填写退货数量','warning'); return; }
    try { await confirm('确认提交采购退货？'); } catch(e){ return; }
    submitting.value = true;
    try {
      const res = await api.post('/purchase-returns', { supplierId: supplierId.value, items: sel.map(i => ({ productId: i.productId, qty: i.returnQty, costPrice: i.costPrice })), returnTotal: returnTotal.value });
      toast('退货成功：' + res.orderNo, 'success');
      // 提交完就把选择器清掉，避免重复点「提交退货」再建一张同样的单
      orderId.value = null; items.value = [];
      page.value = 1; load();
    } catch(e){}
    finally { submitting.value = false; }
  }

  async function load() {
    loading.value = true;
    try {
      const res = await api.get('/purchase-returns', { params: { keyword: keyword.value, page: page.value, pageSize: pageSize.value } });
      records.value = res.list || []; total.value = res.total || 0;
      summaryInfo.value = res.summary || null;
    } catch(e){}
    finally { loading.value = false; }
  }
  function search() { page.value = 1; load(); }

  async function doVoid(row) {
    try {
      await confirm(`确认作废退货单「${row.orderNo}」？作废后库存将回补，该单不再计入供应商对账，且不可恢复。`);
    } catch(e) { return; }
    try {
      await api.post('/purchase-returns/' + row.id + '/void');
      toast('已作废', 'success');
      load();
    } catch(e){}
  }

  onMounted(() => { loadSuppliers(); load(); });
  return {
    suppliers, orders, supplierId, orderId, items, submitting, returnTotal,
    records, loading, keyword, page, pageSize, total, summaryInfo, recordSummary,
    loadOrders, loadDetail, submit, load, search, doVoid, common, toast,
  };
}
</script>
