<div>
  <div class="stat-row">
    <div class="stat-card danger"><div class="label">总欠款</div><div class="value">{{ common.money(stats.totalCredit) }}</div></div>
    <div class="stat-card warn"><div class="label">未结清笔数</div><div class="value">{{ stats.unsettled }}</div></div>
    <div class="stat-card success"><div class="label">已结清笔数</div><div class="value">{{ stats.settled }}</div></div>
  </div>
  <div class="page-card">
    <div class="toolbar">
      <el-input v-model="keyword" placeholder="微信号 / 手机号 / 备注 / 单号" clearable style="width:240px;" @keyup.enter="search" />
      <el-date-picker v-model="dateFrom" type="date" value-format="YYYY-MM-DD" placeholder="开始日期" clearable style="width:150px;" />
      <span style="margin:0 4px;color:#999;">至</span>
      <el-date-picker v-model="dateTo" type="date" value-format="YYYY-MM-DD" placeholder="结束日期" clearable style="width:150px;" />
      <el-select v-model="statusFilter" placeholder="结清状态" clearable style="width:130px;">
        <el-option label="未结清" value="未结清" /><el-option label="已结清" value="已结清" />
      </el-select>
      <el-button type="primary" @click="search">查询</el-button>
      <el-button @click="exportList">导出 CSV</el-button>
      <el-button type="success" @click="exportExcel">导出 Excel</el-button>
    </div>
    <div class="table-wrap">
      <el-table :data="list" v-loading="loading" border size="small">
        <el-table-column label="微信号" width="140"><template #default="{ row }"><span :class="{ muted: !row.wechatId }">{{ row.wechatId || '—' }}</span></template></el-table-column>
        <el-table-column label="手机号" width="130"><template #default="{ row }"><span :class="{ muted: !row.phone }">{{ row.phone || '—' }}</span></template></el-table-column>
        <el-table-column label="关联单号" prop="saleOrderNo" width="160" />
        <el-table-column label="欠款金额" width="110"><template #default="{ row }">{{ common.money(row.creditAmount) }}</template></el-table-column>
        <el-table-column label="已还" width="100"><template #default="{ row }">{{ common.money(row.paidAmount) }}</template></el-table-column>
        <el-table-column label="剩余" width="110"><template #default="{ row }"><span class="danger-text">{{ common.money(row.remainingAmount) }}</span></template></el-table-column>
        <el-table-column label="状态" width="90"><template #default="{ row }"><el-tag :type="row.status === '已结清' ? 'success' : 'danger'" size="small">{{ row.status }}</el-tag></template></el-table-column>
        <el-table-column label="备注" min-width="120" show-overflow-tooltip><template #default="{ row }"><span :class="{ muted: !row.remark }">{{ row.remark || '—' }}</span></template></el-table-column>
        <el-table-column label="赊账时间" prop="createdAt" width="160" />
        <el-table-column label="操作" width="100" fixed="right" align="center"><template #default="{ row }"><el-button text type="primary" title="编辑" @click="openEdit(row)"><el-icon><Edit /></el-icon></el-button><el-button v-if="row.status === '未结清'" text type="success" title="结清" @click="openSettle(row)"><el-icon><Money /></el-icon></el-button></template></el-table-column>
      </el-table>
    </div>
    <div class="pagination-wrap">
      <el-pagination
        v-model:current-page="page" v-model:page-size="pageSize" :total="total"
        layout="total, prev, pager, next" @current-change="load" />
    </div>
  </div>

  <el-dialog v-model="settleDialog" title="结清赊账" width="420px">
    <div style="text-align:center;margin-bottom:14px;">
      <div class="muted">顾客：{{ current?.wechatId }}</div>
      <div class="cart-total" style="font-size:26px;">{{ common.money(current?.remainingAmount) }}</div>
    </div>
    <el-form label-width="90px">
      <el-form-item label="还款方式">
        <el-radio-group v-model="payMethod">
          <el-radio-button label="微信">微信</el-radio-button>
          <el-radio-button label="现金">现金</el-radio-button>
          <el-radio-button label="支付宝">支付宝</el-radio-button>
        </el-radio-group>
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="settleDialog=false">取消</el-button>
      <el-button type="primary" :loading="settling" @click="confirmSettle">确认结清</el-button>
    </template>
  </el-dialog>

  <el-dialog v-model="editDialog" title="编辑赊账信息" width="420px">
    <el-form label-width="80px">
      <el-form-item label="微信号">
        <span>{{ editRow?.wechatId }}</span>
      </el-form-item>
      <el-form-item label="手机号">
        <el-input v-model="editForm.phone" placeholder="顾客手机号" maxlength="20" />
      </el-form-item>
      <el-form-item label="备注">
        <el-input v-model="editForm.remark" type="textarea" :rows="3" placeholder="备注信息" />
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="editDialog=false">取消</el-button>
      <el-button type="primary" :loading="editSaving" @click="confirmEdit">保存</el-button>
    </template>
  </el-dialog>
</div>

<script page-setup>
function pageSetup(deps) {
  const { ref, onMounted } = Vue;
  const { api, common, toast, confirm } = deps;
  const list = ref([]); const loading = ref(false);
  const keyword = ref(''); const statusFilter = ref('');
  const dateFrom = ref(''); const dateTo = ref('');
  const page = ref(1); const pageSize = ref(20); const total = ref(0);
  const stats = ref({ totalCredit: 0, unpaidTotal: 0, unsettled: 0, settled: 0 });

  async function load() {
    loading.value = true;
    try {
      const { from, to } = common.normalizeDatePair(dateFrom.value, dateTo.value);
      const params = { keyword: keyword.value, status: statusFilter.value, page: page.value, pageSize: pageSize.value };
      if (from) params.dateFrom = from;
      if (to) params.dateTo = to;
      const res = await api.get('/credits', { params });
      list.value = res.list || [];
      total.value = res.total || 0;
      if (res.stats) stats.value = res.stats;
    } catch(e){}
    finally { loading.value = false; }
  }
  function search() { page.value = 1; load(); }

  const settleDialog = ref(false); const current = ref(null); const payMethod = ref('微信'); const settling = ref(false);

  const editDialog = ref(false); const editRow = ref(null); const editSaving = ref(false);
  const editForm = ref({ phone: '', remark: '' });
  function openEdit(row) {
    editRow.value = row;
    editForm.value = { phone: row.phone || '', remark: row.remark || '' };
    editDialog.value = true;
  }
  async function confirmEdit() {
    editSaving.value = true;
    try {
      await api.put('/credits/' + editRow.value.id, { phone: editForm.value.phone, remark: editForm.value.remark });
      toast('已保存', 'success'); editDialog.value = false; load();
    } catch(e){}
    finally { editSaving.value = false; }
  }
  function openSettle(row) { current.value = row; payMethod.value = '微信'; settleDialog.value = true; }
  async function confirmSettle() {
    try { await confirm('确认结清此笔赊账？'); } catch(e){ return; }
    settling.value = true;
    try { await api.post('/credits/' + current.value.id + '/settle', { payMethod: payMethod.value }); toast('已结清','success'); settleDialog.value = false; load(); } catch(e){}
    finally { settling.value = false; }
  }
  async function exportList() {
    const params = { keyword: keyword.value, status: statusFilter.value, format: 'csv' };
    if (dateFrom.value) params.dateFrom = dateFrom.value;
    if (dateTo.value) params.dateTo = dateTo.value;
    const ok = await common.downloadExcel('/export/credits', params, '赊账记录.csv');
    if (ok) toast('已导出','success');
  }

  async function exportExcel() {
    const params = { keyword: keyword.value, status: statusFilter.value };
    if (dateFrom.value) params.dateFrom = dateFrom.value;
    if (dateTo.value) params.dateTo = dateTo.value;
    const ok = await common.downloadExcel('/export/credits', params, '赊账记录.xlsx');
    if (ok) toast('已导出','success');
  }

  onMounted(load);
  return { list, loading, keyword, statusFilter, dateFrom, dateTo, page, pageSize, total, stats,
    load, search,
    settleDialog, current, payMethod, settling, openSettle, confirmSettle,
    editDialog, editRow, editSaving, editForm, openEdit, confirmEdit,
    exportList, exportExcel, common, toast };
}
</script>
