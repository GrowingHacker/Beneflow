<div>
  <div class="page-card">
    <div class="toolbar">
      <el-input v-model="keyword" placeholder="商品名称 / 条码" clearable style="width:220px;" @keyup.enter="search" />
      <el-select v-model="statusFilter" placeholder="状态" clearable style="width:120px;">
        <el-option label="正常" value="正常" /><el-option label="预警" value="预警" />
        <el-option label="缺货" value="缺货" /><el-option label="临期" value="临期" /><el-option label="过期" value="过期" />
      </el-select>
      <el-button type="primary" @click="search">查询</el-button>
      <el-button @click="exportCsv">导出</el-button>
    </div>
    <div class="table-wrap">
      <el-table :data="filtered" v-loading="loading" border stripe size="small">
        <el-table-column label="条码" prop="barcode" width="150" />
        <el-table-column label="名称" prop="name" min-width="160" />
        <el-table-column label="分类" prop="categoryName" width="90" />
        <el-table-column label="成本" width="80"><template #default="{ row }">{{ common.money(row.costPrice) }}</template></el-table-column>
        <el-table-column label="售价" width="80"><template #default="{ row }">{{ common.money(row.salePrice) }}</template></el-table-column>
        <el-table-column label="库存" prop="stockQuantity" width="70" />
        <el-table-column label="库存金额" width="100"><template #default="{ row }">{{ common.money(row.costPrice * row.stockQuantity) }}</template></el-table-column>
        <el-table-column label="安全库存" prop="safetyStock" width="90" />
        <el-table-column label="有效期" width="110"><template #default="{ row }"><span v-if="row.expireDate" :class="expireClass(row)">{{ row.expireDate }}</span><span v-else class="muted">—</span></template></el-table-column>
        <el-table-column label="状态" width="80"><template #default="{ row }"><el-tag :type="statusType(row)" size="small">{{ statusText(row) }}</el-tag></template></el-table-column>
      </el-table>
    </div>
    <div class="pagination-wrap">
      <el-pagination
        v-model:current-page="page" v-model:page-size="pageSize" :total="total"
        :page-sizes="[10,20,50]" layout="total, sizes, prev, pager, next" @size-change="load" @current-change="load" />
    </div>
  </div>
</div>

<script page-setup>
function pageSetup(deps) {
  const { ref, computed, onMounted } = Vue;
  const { api, common, toast } = deps;

  const list = ref([]); const loading = ref(false);
  const keyword = ref(''); const statusFilter = ref('');
  const page = ref(1); const pageSize = ref(20); const total = ref(0);

  const filtered = computed(() => statusFilter.value ? list.value.filter(r => statusText(r) === statusFilter.value) : list.value);

  async function load() {
    loading.value = true;
    try { const res = await api.get('/stocks', { params: { keyword: keyword.value, page: page.value, pageSize: pageSize.value } }); list.value = res.list||[]; total.value = res.total||0; } catch(e){}
    finally { loading.value = false; }
  }
  function search() { page.value = 1; load(); }

  function statusText(row) {
    if (row.expireDate) { const d = (new Date(row.expireDate) - new Date())/86400000; if (d < 0) return '过期'; if (d < 30) return '临期'; }
    if ((row.stockQuantity||0) <= 0) return '缺货';
    if ((row.stockQuantity||0) <= (row.safetyStock||0)) return '预警';
    return '正常';
  }
  function statusType(row) { const s = statusText(row); return s==='缺货'?'danger':s==='预警'?'warning':s==='临期'?'warning':s==='过期'?'danger':'success'; }
  function expireClass(row) { if (!row.expireDate) return 'muted'; const d=(new Date(row.expireDate)-new Date())/86400000; return d<0?'danger-text':d<7?'danger-text':d<30?'warn-text':'muted'; }

  function exportCsv() {
    if (!filtered.value.length) { toast('无可导出数据', 'warning'); return; }
    const header = ['条码','名称','分类','成本','售价','库存','安全库存','有效期','状态'];
    const lines = [header.join(',')];
    filtered.value.forEach(r => lines.push([r.barcode,r.name,r.categoryName,r.costPrice,r.salePrice,r.stockQuantity,r.safetyStock,r.expireDate||'',statusText(r)].map(v=>'"'+(v==null?'':v)+'"').join(',')));
    common.downloadBlob(new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'}), '实时库存.csv');
    toast('已导出','success');
  }

  onMounted(load);
  return { list, loading, keyword, statusFilter, filtered, page, pageSize, total,
    load, search, statusText, statusType, expireClass, exportCsv, common, toast };
}
</script>
